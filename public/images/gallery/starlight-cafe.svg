<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="night-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#311042" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" rx="20" fill="url(#night-grad)" />

  <!-- Stars -->
  <circle cx="50" cy="80" r="2" fill="#fff" />
  <circle cx="120" cy="50" r="1.5" fill="#fff" />
  <circle cx="280" cy="70" r="2.5" fill="#fff" />
  <circle cx="340" cy="120" r="1" fill="#fff" />
  <circle cx="90" cy="180" r="2" fill="#fff" />
  <circle cx="210" cy="100" r="1.5" fill="#fff" />
  
  <!-- Shooting Star -->
  <line x1="300" y1="40" x2="350" y2="90" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  
  <!-- Big Crescent Moon -->
  <path d="M70 60 A 30 30 0 1 0 120 100 A 25 25 0 1 1 70 60 Z" fill="#fef08a" filter="url(#glow)" />

  <!-- Cafe Canopy -->
  <path d="M10 200 L390 200 L370 240 L30 240 Z" fill="#fff0f3" stroke="#704c50" stroke-width="5" />
  <!-- Canopy stripes -->
  <path d="M30 200 L60 200 L55 240 L35 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />
  <path d="M90 200 L120 200 L115 240 L95 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />
  <path d="M150 200 L180 200 L175 240 L155 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />
  <path d="M210 200 L240 200 L235 240 L215 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />
  <path d="M270 200 L300 200 L295 240 L275 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />
  <path d="M330 200 L360 200 L355 240 L335 240 Z" fill="#ffccd5" stroke="#704c50" stroke-width="5" />

  <!-- Cafe Table -->
  <ellipse cx="200" cy="390" rx="140" ry="40" fill="#fffaf0" stroke="#704c50" stroke-width="6" />
  <!-- Table Stand -->
  <rect x="185" y="390" width="30" height="90" fill="#cbd5e1" stroke="#704c50" stroke-width="6" />
  <path d="M150 480 L250 480" stroke="#704c50" stroke-width="8" stroke-linecap="round" />

  <!-- Glowing Hanging Lanterns -->
  <line x1="120" y1="200" x2="120" y2="280" stroke="#704c50" stroke-width="3" />
  <circle cx="120" cy="290" r="18" fill="#fde047" stroke="#704c50" stroke-width="4" filter="url(#glow)" />
  
  <line x1="280" y1="200" x2="280" y2="270" stroke="#704c50" stroke-width="3" />
  <circle cx="280" cy="280" r="18" fill="#fde047" stroke="#704c50" stroke-width="4" filter="url(#glow)" />

  <!-- Coffee & Cake on table -->
  <!-- Cake plate -->
  <ellipse cx="140" cy="380" rx="30" ry="12" fill="#fff0f3" stroke="#704c50" stroke-width="3" />
  <!-- Cake slice -->
  <path d="M125 375 L155 365 L155 378 L125 383 Z" fill="#ffb3c1" stroke="#704c50" stroke-width="3" />
  <!-- Cherry -->
  <circle cx="140" cy="360" r="4" fill="#ef4444" />
  
  <!-- Coffee cup -->
  <path d="M230 365 L260 365 L255 385 L235 385 Z" fill="#fef2f2" stroke="#704c50" stroke-width="3" />
  <!-- Handle -->
  <path d="M260 370 C267 370 267 380 260 380" fill="none" stroke="#704c50" stroke-width="3" />
  <!-- Coffee liquid -->
  <ellipse cx="245" cy="365" rx="12" ry="4" fill="#7c2d12" />

  <!-- Cozy Title Tag -->
  <rect x="130" y="450" width="140" height="30" rx="15" fill="#704c50" />
  <text x="200" y="470" fill="#fffaf0" font-family="'Fredoka', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Starlight Café</text>
</svg>
