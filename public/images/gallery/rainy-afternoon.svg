<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="room-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#ffccd5" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" rx="20" fill="url(#room-grad)" />

  <!-- Window Frame -->
  <rect x="40" y="40" width="320" height="220" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="6" />
  <!-- Window Glass (Rainy Sky) -->
  <rect x="52" y="52" width="296" height="196" rx="5" fill="#94a3b8" />
  
  <!-- Window dividers -->
  <line x1="200" y1="52" x2="200" y2="248" stroke="#475569" stroke-width="4" />
  <line x1="52" y1="150" x2="348" y2="150" stroke="#475569" stroke-width="4" />

  <!-- Rain Drops on glass -->
  <path d="M100 80 L98 90 M120 120 L118 135 M250 90 L248 105 M280 180 L277 200 M150 170 L148 185 M80 200 L78 210 M320 110 L318 125" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

  <!-- Rain Clouds outside -->
  <path d="M60 90 C80 90 90 80 110 80 C130 80 140 95 160 95 C180 95 190 85 210 85 L210 110 L60 110 Z" fill="#64748b" opacity="0.5" />
  <path d="M220 90 C235 90 245 80 260 80 C275 80 285 95 300 95 L300 115 L220 115 Z" fill="#64748b" opacity="0.5" />

  <!-- Cozy Sofa inside -->
  <path d="M30 380 L370 380 C380 380 390 390 390 405 L390 470 L10 470 L10 405 C10 390 20 380 30 380 Z" fill="#fffaf0" stroke="#704c50" stroke-width="6" />
  <!-- Sofa Backrest cushions -->
  <rect x="35" y="310" width="160" height="80" rx="15" fill="#fcf6ec" stroke="#704c50" stroke-width="5" />
  <rect x="205" y="310" width="160" height="80" rx="15" fill="#fcf6ec" stroke="#704c50" stroke-width="5" />
  
  <!-- Pillow -->
  <rect x="50" y="330" width="60" height="60" rx="10" transform="rotate(-15 50 330)" fill="#ffccd5" stroke="#704c50" stroke-width="4" />
  
  <!-- Sleeping Cat on Sofa -->
  <g transform="translate(230, 335)">
    <!-- Cat body -->
    <ellipse cx="40" cy="35" rx="30" ry="20" fill="#8c6e72" stroke="#704c50" stroke-width="4" />
    <circle cx="20" cy="25" r="15" fill="#8c6e72" stroke="#704c50" stroke-width="4" />
    <!-- Cat ears -->
    <polygon points="10,15 15,5 20,13" fill="#704c50" />
    <polygon points="25,13 30,5 33,15" fill="#704c50" />
    <!-- Sleeping eyes -->
    <path d="M12 26 Q15 29 18 26" stroke="#4a2f32" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M22 26 Q25 29 28 26" stroke="#4a2f32" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Tail -->
    <path d="M68 40 C75 40 80 30 80 20 C80 15 75 15 75 20 C75 25 70 30 65 30" fill="none" stroke="#704c50" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Potted Plant on window sill -->
  <rect x="65" y="230" width="30" height="35" rx="5" fill="#b45309" stroke="#704c50" stroke-width="4" />
  <path d="M80 230 C75 210 60 200 65 190 C70 180 80 195 80 230 Z" fill="#34d399" stroke="#704c50" stroke-width="3" />
  <path d="M80 230 C85 210 100 200 95 190 C90 180 80 195 80 230 Z" fill="#34d399" stroke="#704c50" stroke-width="3" />

  <!-- Cozy Title Tag -->
  <rect x="130" y="450" width="140" height="30" rx="15" fill="#704c50" />
  <text x="200" y="470" fill="#fffaf0" font-family="'Fredoka', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Rainy Afternoon</text>
</svg>
