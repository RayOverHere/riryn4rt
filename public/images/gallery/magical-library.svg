<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lib-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#4a044e" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <filter id="magic-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" rx="20" fill="url(#lib-bg)" />

  <!-- Stars / Magic Dust -->
  <circle cx="80" cy="90" r="1.5" fill="#fde047" filter="url(#magic-glow)" />
  <circle cx="150" cy="140" r="2.5" fill="#fde047" filter="url(#magic-glow)" />
  <circle cx="320" cy="110" r="2" fill="#fde047" filter="url(#magic-glow)" />
  <circle cx="280" cy="180" r="1" fill="#fff" />
  <circle cx="90" cy="220" r="2" fill="#fff" />

  <!-- Wooden Bookshelves left/right -->
  <rect x="0" y="50" width="40" height="380" fill="#78350f" stroke="#451a03" stroke-width="4" />
  <rect x="360" y="50" width="40" height="380" fill="#78350f" stroke="#451a03" stroke-width="4" />
  <!-- Shelves -->
  <line x1="0" y1="150" x2="40" y2="150" stroke="#451a03" stroke-width="4" />
  <line x1="0" y1="270" x2="40" y2="270" stroke="#451a03" stroke-width="4" />
  <line x1="360" y1="150" x2="400" y2="150" stroke="#451a03" stroke-width="4" />
  <line x1="360" y1="270" x2="400" y2="270" stroke="#451a03" stroke-width="4" />

  <!-- Books on shelves -->
  <rect x="5" y="80" width="10" height="70" fill="#f43f5e" />
  <rect x="18" y="90" width="12" height="60" fill="#3b82f6" />
  <rect x="368" y="80" width="12" height="70" fill="#10b981" />
  <rect x="383" y="100" width="10" height="50" fill="#f59e0b" />
  
  <rect x="8" y="200" width="15" height="70" fill="#8b5cf6" />
  <rect x="372" y="210" width="12" height="60" fill="#ec4899" />

  <!-- Big Open Window in center -->
  <path d="M70 120 C70 40 330 40 330 120 L330 350 L70 350 Z" fill="#1e1b4b" stroke="#704c50" stroke-width="6" />
  <!-- Stars outside window -->
  <circle cx="120" cy="110" r="1.5" fill="#fff" />
  <circle cx="280" cy="100" r="1.5" fill="#fff" />
  <circle cx="200" cy="70" r="2.5" fill="#fde047" filter="url(#magic-glow)" />

  <!-- Flying Glowing Book in center -->
  <g transform="translate(140, 180)" filter="url(#magic-glow)">
    <!-- Wings of book -->
    <path d="M10 25 C10 -5 55 5 55 25 L55 55 C55 35 10 25 10 25 Z" fill="#fff" stroke="#704c50" stroke-width="3" />
    <path d="M100 25 C100 -5 55 5 55 25 L55 55 C55 35 100 25 100 25 Z" fill="#fff" stroke="#704c50" stroke-width="3" />
    <!-- Book Cover -->
    <path d="M5 28 L55 58 L105 28 L55 62 Z" fill="#a21caf" />
    <!-- Pages lines -->
    <path d="M20 28 C30 20 45 22 50 30" stroke="#704c50" stroke-width="2" fill="none" />
    <path d="M90 28 C80 20 65 22 60 30" stroke="#704c50" stroke-width="2" fill="none" />
  </g>

  <!-- Glowing lantern hanging from ceiling -->
  <line x1="200" y1="0" x2="200" y2="40" stroke="#704c50" stroke-width="3" />
  <path d="M185 40 L215 40 L210 65 L190 65 Z" fill="#fbbf24" stroke="#704c50" stroke-width="3" filter="url(#magic-glow)" />

  <!-- Cozy Title Tag -->
  <rect x="130" y="450" width="140" height="30" rx="15" fill="#704c50" />
  <text x="200" y="470" fill="#fffaf0" font-family="'Fredoka', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Magical Library</text>
</svg>
